# Ampla → B2MML Mapping Configuration (V0600)
# -------------------------------------------
# Controls datatype normalization, level mapping, hierarchy rules,
# property cleanup, UOM normalization, and B2MML metadata.

[level_map]
# Maps Ampla internal folder types to ISA‑95 Equipment Element Levels
"Citect.Ampla.Isa95.EnterpriseFolder" = "Enterprise"
"Citect.Ampla.Isa95.SiteFolder"       = "Site"
"Citect.Ampla.Isa95.AreaFolder"       = "Area"
"Citect.Ampla.General.Server.ApplicationsFolder" = "Other"

[hierarchy]
# ISA‑95 structural validation rules (optional)
"Enterprise" = ["Enterprise", "Site"]
"Site"       = ["Area"]
"Area"       = ["WorkCenter", "ProcessCell", "ProductionLine", "Other"]
"Other"      = ["Other"]

[properties]
# Prefixes removed from property names
strip_prefixes = ["Class.", "Local.", "Global.", "Reporting."]

# Properties excluded from B2MML output
exclude = [
    "IsSelected",
    "Color",
    "HelpContextID",
    "DisplayOrder",
    "Locked",
    "Owner",
    "SequenceID"
]

# Optional renaming rules
rename = {}

# Required properties for B2MML EquipmentProperty
required = ["ID", "EquipmentLevel"]

[datatypes]
# Normalized datatype mapping for V0600 ValueType generation
"System.String"   = "string"
"System.Int32"    = "int"
"System.Double"   = "float"
"System.Boolean"  = "boolean"
"System.DateTime" = "datetime"
"System.Decimal"  = "decimal"

# Fallback for unknown datatypes
fallback = "string"

[uom.map]
tonne = ["t"]
kilogram = ["kg", "kgs"]
"cubic meter" = ["m3"]
"degree Celsius" = ["degC"]
percent = ["pct"]
hour = ["hrs"]

[metadata]
version   = "V0600"
namespace = "http://www.mesa.org/xml/B2MML-V0600"

[validation]
enable_hierarchy = false
